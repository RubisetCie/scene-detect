name: Python Distribution
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version
        default: '3.13'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip build wheel virtualenv setuptools
          pip install -e . --only-binary av,opencv-python

      - name: Build Package
        shell: bash
        run: |
          python packaging/build_all.py
          echo "scenedetect_version=`python -c \"import scenedetect; print(scenedetect.__version__.replace('-', '.'))\"`" >> "$GITHUB_ENV"

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: scene-detect.zip
          path: |
            dist/*.whl
